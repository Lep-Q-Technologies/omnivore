name: Security Audit

on:
  # Run on every push to main and PRs
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Run weekly security scans
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9 AM UTC
  # Allow manual trigger
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm audit (Node.js Security)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/api-nest
          - packages/omnivore-polish
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.2.1'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.package }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Run npm audit
        working-directory: ${{ matrix.package }}
        run: |
          echo "::group::npm audit report"
          npm audit --audit-level=moderate --json > audit-report.json || true
          npm audit --audit-level=moderate
          echo "::endgroup::"
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-${{ matrix.package }}-report
          path: ${{ matrix.package }}/audit-report.json
          retention-days: 30

      - name: Check for high/critical vulnerabilities
        working-directory: ${{ matrix.package }}
        run: |
          # Fail the workflow if there are high or critical vulnerabilities
          npm audit --audit-level=high
        continue-on-error: false

  dependency-review:
    name: Dependency Review (GitHub)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on critical and high vulnerabilities
          fail-on-severity: high
          # Allow security advisories from these sources
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, ISC, BSD-2-Clause

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Auto-detect queries from .github/codeql/queries
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  docker-security-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: packages/api-nest
        run: |
          docker build -t omnivore-api-nest:test .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'omnivore-api-nest:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, dependency-review, codeql-analysis, docker-security-scan]
    if: always()
    steps:
      - name: Download all audit reports
        uses: actions/download-artifact@v4
        with:
          path: audit-reports

      - name: Generate security summary
        run: |
          echo "# Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- npm audit: ${{ needs.npm-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Review: ${{ needs.dependency-review.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL Analysis: ${{ needs.codeql-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Security Scan: ${{ needs.docker-security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed security reports in the workflow artifacts." >> $GITHUB_STEP_SUMMARY
