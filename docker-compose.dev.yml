services:
  postgres:
    image: "ankane/pgvector:v0.5.1"
    container_name: "omnivore-postgres-dev"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnivore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omnivore"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: ./packages/db/Dockerfile
    container_name: "omnivore-migrate-dev"
    environment:
      - PGPASSWORD=postgres
      - POSTGRES_USER=postgres
      - PG_HOST=postgres
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_DB=omnivore
      - FRESH_DB=${FRESH_DB:-false}
      # Remove NO_DEMO_USER to enable demo user creation in development
      # To disable demo user, set: NO_DEMO_USER=true
      # - NO_DEMO_USER=true
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo '🚀 Starting database setup...'
        
        # Conditional fresh database drop
        if [ \"$$FRESH_DB\" = \"true\" ]; then
          echo '🔄 FRESH_DB=true: Dropping existing database...'
          psql -h postgres -U postgres -c 'DROP DATABASE IF EXISTS omnivore;'
          echo '✓ Database dropped'
        else
          echo '📦 FRESH_DB=false: Preserving existing data'
        fi
        
        echo 'Creating database if not exists...'
        psql -h postgres -U postgres -c 'CREATE DATABASE omnivore;' || true
        
        echo 'Creating users...'
        # PostgreSQL doesn't support IF NOT EXISTS for CREATE USER, so check first
        psql -h postgres -U postgres -tc \"SELECT 1 FROM pg_roles WHERE rolname='app_user'\" | grep -q 1 || \
          psql -h postgres -U postgres -c \"CREATE USER app_user WITH ENCRYPTED PASSWORD 'postgres';\"
        echo '✓ app_user ready'
        
        echo 'Running migrations...'
        cd /app/packages/db && yarn migrate
        
        echo 'Granting permissions...'
        psql -h postgres -U postgres -d omnivore -c 'GRANT omnivore_user TO app_user;' || true
        
        # Idempotent demo user creation
        if [ -z \"$${NO_DEMO_USER}\" ]; then
          echo 'Checking for demo user...'
          USER_EXISTS=$$(psql -h postgres -U postgres -d omnivore -t -c \"SELECT COUNT(*) FROM omnivore.user WHERE email='demo@omnivore.app'\" | xargs)
          
          if [ \"$$USER_EXISTS\" = \"0\" ]; then
            echo 'Creating demo user...'
            USER_ID=$$(uuidgen)
            PASSWORD='$$2a$$10$$41G6b1BDUdxNjH1QFPJYDOM29EE0C9nTdjD1FoseuQ8vZU1NWtrh6'
            psql -h postgres -U postgres -d omnivore -c \"
              INSERT INTO omnivore.user (id, source, email, source_user_id, name, password, email_alias) 
              VALUES ('$$USER_ID', 'EMAIL', 'demo@omnivore.app', 'demo@omnivore.app', 'Demo User', '$$PASSWORD', 'demo_user')
              ON CONFLICT (email) DO NOTHING;
              
              INSERT INTO omnivore.user_profile (user_id, username) 
              SELECT id, 'demo_user' FROM omnivore.user WHERE email = 'demo@omnivore.app'
              ON CONFLICT (username) DO NOTHING;
            \"
            echo '✅ Created demo user: demo@omnivore.app / demo_password'
          else
            echo '✓ Demo user already exists'
          fi
        else
          echo 'NO_DEMO_USER set - skipping demo user creation'
        fi
        
        echo '✅ Database setup completed successfully'
      "

  api-nest:
    build:
      context: .
      dockerfile: packages/api-nest/Dockerfile
      target: builder
    container_name: "omnivore-api-nest-dev"
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=development
      - NEST_PORT=4001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=omnivore
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-at-least-32-characters-long-for-development
      - FRONTEND_URL=http://localhost:3000,http://localhost:3010
      # OAuth Configuration
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-63233828890-nlsc5rl1bpoh40mkl1aipnl6vv8o5hgg.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
      - GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-dummy-ios-client-id}
      - GOOGLE_ANDROID_CLIENT_ID=${GOOGLE_ANDROID_CLIENT_ID:-dummy-android-client-id}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./packages/api-nest:/app/packages/api-nest
      - ./packages/db:/app/packages/db
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - /app/packages/api-nest/node_modules
    command: yarn start:dev
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:4001/api/v2/health'', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  web-vite:
    build:
      context: .
      dockerfile: packages/web-vite/Dockerfile.dev
    container_name: "omnivore-web-vite-dev"
    ports:
      - "3000:3000"
    environment:
      # Vite Environment
      - NODE_ENV=development
      - VITE_APP_ENV=local

      # API Configuration
      - VITE_API_URL=http://localhost:4001/api/v2
      - VITE_SERVER_BASE_URL=http://localhost:4001

      # Base URLs
      - VITE_BASE_URL=http://localhost:3000
      - VITE_HIGHLIGHTS_BASE_URL=http://localhost:3000
      - VITE

      # OAuth Configuration (dummy values for development UI testing)
      - VITE_GAUTH_CLIENT_ID=${GAUTH_CLIENT_ID:-dummy-google-client-id-for-development.apps.googleusercontent.com}
      - VITE_GAUTH_IOS_CLIENT_ID=${GAUTH_IOS_CLIENT_ID:-dummy-ios-client-id}
      - VITE_GAUTH_ANDROID_CLIENT_ID=${GAUTH_ANDROID_CLIENT_ID:-dummy-android-client-id}
      - VITE_APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-dummy-apple-client-id}
    depends_on:
      api-nest:
        condition: service_healthy
    volumes:
      - ./packages/web-vite:/app/packages/web-vite
      - /app/packages/web-vite/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
    restart: unless-stopped

  omnivore-polish:
    build:
      context: .
      dockerfile: packages/omnivore-polish/Dockerfile.dev
    container_name: "omnivore-polish-dev"
    ports:
      - "3010:3010"
    environment:
      # Vite Environment
      - NODE_ENV=development
      - VITE_APP_ENV=local

      # API Configuration (browser access via localhost)
      - VITE_API_URL=http://localhost:4001/api/v2
      - VITE_SERVER_BASE_URL=http://localhost:4001
      - VITE_GRAPHQL_URL=http://localhost:4001/api/graphql

      # Base URLs
      - VITE_BASE_URL=http://localhost:3010
      - VITE_HIGHLIGHTS_BASE_URL=http://localhost:3010

      # OAuth Configuration
      - VITE_GAUTH_CLIENT_ID=${GAUTH_CLIENT_ID:-63233828890-nlsc5rl1bpoh40mkl1aipnl6vv8o5hgg.apps.googleusercontent.com}
      - VITE_GAUTH_IOS_CLIENT_ID=${GAUTH_IOS_CLIENT_ID:-dummy-ios-client-id}
      - VITE_GAUTH_ANDROID_CLIENT_ID=${GAUTH_ANDROID_CLIENT_ID:-dummy-android-client-id}
      - VITE_APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-dummy-apple-client-id}
    depends_on:
      api-nest:
        condition: service_healthy
    volumes:
      - ./packages/omnivore-polish:/app/packages/omnivore-polish
      - /app/packages/omnivore-polish/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3010
    restart: unless-stopped

  redis:
    image: "redis:7.2.4"
    container_name: "omnivore-redis-dev"
    expose:
      - 6379
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  redis_data:
