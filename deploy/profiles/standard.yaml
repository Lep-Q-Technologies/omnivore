version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: omnivore-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: omnivore
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: omnivore-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: omnivore-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"  # MinIO console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  omnivore:
    image: omnivore/omnivore:standard
    container_name: omnivore-app
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.consolidated
      args:
        PROFILE: standard
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Core configuration
      - NODE_ENV=production
      - PORT=3000
      - DEPLOYMENT_PROFILE=standard
      
      # Database - PostgreSQL
      - DATABASE_TYPE=postgres
      - PG_HOST=postgres
      - PG_USER=postgres
      - PG_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PG_DB=omnivore
      - PG_PORT=5432
      - PG_POOL_MAX=20
      
      # Redis
      - REDIS_URL=redis://redis:6379
      - MQ_REDIS_URL=redis://redis:6379
      
      # Storage - S3/MinIO
      - USE_S3=true
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_REGION=us-east-1
      - GCS_UPLOAD_BUCKET=omnivore-uploads
      
      # Enable standard features
      - ENABLE_AI_FEATURES=false
      - ENABLE_EMAIL=true
      - ENABLE_RSS=true
      - ENABLE_ELASTICSEARCH=false
      - ENABLE_PUPPETEER=true
      - ENABLE_THUMBNAILS=true
      - ENABLE_TTS=false
      - ENABLE_NEWSLETTERS=true
      - ENABLE_WEBHOOKS=true
      - ENABLE_API=true
      
      # Enable popular integrations
      - ENABLE_POCKET=true
      - ENABLE_INSTAPAPER=true
      - ENABLE_READWISE=true
      - ENABLE_LOGSEQ=true
      - ENABLE_OBSIDIAN=true
      - ENABLE_NOTION=false
      
      # Security
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret}
      - SESSION_SECRET=${SESSION_SECRET:-please-change-this-secret}
      - SSO_JWT_SECRET=${SSO_JWT_SECRET:-please-change-this-secret}
      
      # URLs
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - GATEWAY_URL=${GATEWAY_URL:-http://localhost:3000/api}
      
    volumes:
      - app-data:/data
      
    ports:
      - "3000:3000"
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      
    restart: unless-stopped

  omnivore-worker:
    image: omnivore/omnivore-worker:standard
    container_name: omnivore-worker
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.worker
      args:
        PROFILE: standard
    depends_on:
      - omnivore
      - redis
    environment:
      # Core configuration
      - NODE_ENV=production
      - DEPLOYMENT_PROFILE=standard
      
      # Redis for job queue
      - REDIS_URL=redis://redis:6379
      - MQ_REDIS_URL=redis://redis:6379
      
      # Database connection
      - DATABASE_TYPE=postgres
      - PG_HOST=postgres
      - PG_USER=postgres
      - PG_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PG_DB=omnivore
      
      # Storage
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      
      # Worker configuration
      - WORKER_CONCURRENCY=5
      - ENABLE_PUPPETEER=true
      - ENABLE_PDF_PROCESSING=true
      - ENABLE_THUMBNAIL_GENERATION=true
      
    volumes:
      - worker-data:/data
      
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: omnivore-nginx
    depends_on:
      - omnivore
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  app-data:
  worker-data: